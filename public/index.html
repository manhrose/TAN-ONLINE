<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TẤN ONLINE</title><link rel="stylesheet" href="style.css"></head><body>
<main class="app"><header><div><div class="eyebrow">TRÒ CHƠI BÀI • 2–4 NGƯỜI</div><h1>TẤN ONLINE</h1></div><div id="room" class="room">CHƯA VÀO PHÒNG</div></header>
<section id="lobby" class="lobby"><div class="lobby-card"><h2>Vào bàn chơi</h2><label>Tên người chơi</label><input id="name" maxlength="18" placeholder="Nhập tên"><div class="lobby-actions"><button id="create" class="primary">TẠO PHÒNG</button><div class="join"><input id="code" maxlength="5" placeholder="MÃ PHÒNG"><button id="join">VÀO PHÒNG</button></div></div><p id="info">Tạo phòng mới hoặc nhập mã phòng có sẵn.</p><div id="waiting"></div><button id="start" class="primary" hidden>BẮT ĐẦU VÁN</button></div></section>
<section id="game" hidden><div class="game-frame"><div class="opponents" id="players"></div><div class="center-zone"><div class="deck-group"><div id="deck" class="deck"><span>0</span></div><small>TỤ BÀI</small></div><div class="trump-group"><div id="trump"></div><small>LÁ CHƯỞNG</small></div></div><div class="battle-zone"><div class="section-label">BÀN ĐÁNH</div><div id="battle"></div><p id="status"></p></div><div class="hand-zone"><div class="section-label">BÀI CỦA BẠN</div><div id="hand"></div><div id="actions"></div></div></div></section><div id="toast"></div></main>
<script src="/socket.io/socket.io.js"></script><script src="app.js"></script></body></html>
